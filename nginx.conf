server {
    listen 80;
    listen 443 ssl ;
    http2 on;
    server_name host_name;
    index index.html;
    root /path/pure-start;
    #CERT-APPLY-CHECK--START
    # 用于SSL证书申请时的文件验证相关配置 -- 请勿删除并保持这段设置在优先级高的位置
    #CERT-APPLY-CHECK--END

    #SSL-START SSL相关配置，请勿删除或修改下一行带注释的404规则
    #error_page 404/404.html;
    #HTTP_TO_HTTPS_START
    set $isRedcert 1;
    if ($server_port != 443) {
        set $isRedcert 2;
    }
    if ( $uri ~ /\.well-known/ ) {
        set $isRedcert 1;
    }
    if ($isRedcert != 1) {
        rewrite ^(/.*)$ https://$host$1 permanent;
    }
    #HTTP_TO_HTTPS_END


    #SSL-END

    #ERROR-PAGE-START  错误页配置，可以注释、删除或修改
    #error_page 404 /404.html;
    #error_page 502 /502.html;
    #ERROR-PAGE-END
    #REWRITE-START URL重写规则引用,修改后将导致面板设置的伪静态规则失效
    #REWRITE-END

    #禁止访问的文件或目录
    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md) {
        return 404;
    }

    #一键申请SSL证书验证目录相关设置
    location ~ \.well-known {
        allow all;
    }

    #禁止在证书验证目录放入敏感文件
    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak|.DS_store)$" ) {
        return 403;
    }

    location ^~ / {
        proxy_pass http://127.0.0.1:13000;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Real-Port $remote_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header REMOTE-HOST $remote_addr;

        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # 新增以下两行强制禁用代理缓存 ↓
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        #覆盖后端可能返回的缓存头 ↓
        proxy_ignore_headers Set-Cookie Cache-Control Expires;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;

        # 强制设置新的缓存头 ↓
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        add_header expires 0;
        add_header etag off;
        add_header last-modified 0;

        access_log /www/wwwlogs/start.log;
        error_log /www/wwwlogs/start.error.log;
    }

    # 图片缓存1天（匹配：jpg, jpeg, png, gif, webp, ico, svg）
    location ~* \.(?:jpg|jpeg|png|gif|webp|ico|svg)$ {
        proxy_pass http://127.0.0.1:13000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Real-Port $remote_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header REMOTE-HOST $remote_addr;

        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # 启用代理缓存并设置缓存头
        proxy_no_cache 0;
        proxy_cache_bypass 0;
        proxy_ignore_headers Set-Cookie Cache-Control Expires;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;

        add_header Cache-Control "public, max-age=86400";
        expires 1d;
    }

    # 字体文件缓存3个月（匹配：woff, woff2, ttf, eot, otf）
    location ~* \.(?:woff|woff2|ttf|eot|otf)$ {
        proxy_pass http://127.0.0.1:13000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Real-Port $remote_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header REMOTE-HOST $remote_addr;

        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_no_cache 0;
        proxy_cache_bypass 0;
        proxy_ignore_headers Set-Cookie Cache-Control Expires;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;

        add_header Cache-Control "public, max-age=7776000";
        expires 90d;
    }

    # JS/CSS缓存30分钟
    location ~* \.(?:js|css)$ {
        proxy_pass http://127.0.0.1:13000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Real-Port $remote_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header REMOTE-HOST $remote_addr;

        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_no_cache 0;
        proxy_cache_bypass 0;
        proxy_ignore_headers Set-Cookie Cache-Control Expires;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;

        add_header Cache-Control "public, max-age=1800";
        expires 30m;
    }
    access_log /path/name.log;
    error_log /path/name.error.log;
}
